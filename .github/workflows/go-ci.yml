name: go

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: go / required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: golang:1.25.13-bookworm@sha256:40dfc169bd5ad8a8617e49c8ead7fe16c6873e79d6937539e9c2e5947b7984ef
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify Go toolchain
        run: go version | grep -F 'go1.25.13'
      - name: Check formatting and vet
        run: make check
      - name: Run linters
        run: make lint
      - name: Run unit tests
        run: make test
      - name: Run race detector
        run: GOFLAGS=-race make test
      - name: Build commands
        run: make build
      - name: Check release contract
        run: make test-release-check
      - name: Run end-to-end tests
        run: make test-e2e
      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  docs:
    name: docs / required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check documentation, workflows, links, and secrets
        run: make docs-check
